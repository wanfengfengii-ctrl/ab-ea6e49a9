services:
  gateway:
    build: .
    image: telemetry-gateway:latest
    ports:
      # Host port is configurable: HOST_PORT=9090 docker compose up
      - "${HOST_PORT:-8080}:8080"
    environment:
      TELEMETRY_DB: /data/nonces.db
      TELEMETRY_KEYS_FILE: /app/config/keys.json
    volumes:
      - nonce-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped

  # One-shot verifier: `docker compose run --rm verify`. Exit code aggregates
  # unit tests, image build and the signing/gzip/concurrency smoke suite.
  verify:
    image: telemetry-gateway:latest
    depends_on:
      gateway:
        conditions:
          - service_healthy
    environment:
      GATEWAY_URL: http://gateway:8080
      TELEMETRY_KEYS_FILE: /app/config/keys.json
    entrypoint: ["python", "-m", "smoke.run_all"]
    restart: "no"

volumes:
  nonce-data:
